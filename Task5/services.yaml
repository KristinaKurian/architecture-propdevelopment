apiVersion: v1
kind: Namespace
metadata:
  name: task5
---
apiVersion: v1
kind: Pod
metadata:
  name: front-end-app
  namespace: task5
  labels:
    app: front-end-app
    role: front-end
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: front-end-app
  namespace: task5
spec:
  selector:
    app: front-end-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: back-end-api-app
  namespace: task5
  labels:
    app: back-end-api-app
    role: back-end-api
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: back-end-api-app
  namespace: task5
spec:
  selector:
    app: back-end-api-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: admin-front-end-app
  namespace: task5
  labels:
    app: admin-front-end-app
    role: admin-front-end
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: admin-front-end-app
  namespace: task5
spec:
  selector:
    app: admin-front-end-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: admin-back-end-api-app
  namespace: task5
  labels:
    app: admin-back-end-api-app
    role: admin-back-end-api
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: admin-back-end-api-app
  namespace: task5
spec:
  selector:
    app: admin-back-end-api-app
  ports:
    - port: 80
      targetPort: 80
